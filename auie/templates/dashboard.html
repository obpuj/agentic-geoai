<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUIE — Bengaluru Urban Intelligence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#101418; --panel:#1a2129; --panel-2:#161c23; --line:#2a3340;
  --text:#e8edf2; --dim:#9aa4b0;
  --built:#e0a83c; --veg:#57a773; --water:#4a90c2; --bare:#8a8f98;
}
*{box-sizing:border-box; margin:0}
body{background:var(--ink); color:var(--text);
  font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
header{display:flex; align-items:baseline; gap:14px; padding:18px 22px 10px}
header h1{font:700 21px "Space Grotesk",sans-serif; letter-spacing:.3px}
header .sub{color:var(--dim); font-size:13px}
.querybar{display:flex; gap:10px; padding:8px 22px 14px}
.querybar input{flex:1; background:var(--panel); border:1px solid var(--line);
  border-radius:8px; color:var(--text); padding:12px 14px; font-size:15px}
.querybar input:focus{outline:2px solid var(--built); outline-offset:0}
.querybar button{background:var(--built); color:#161006; border:0;
  border-radius:8px; padding:0 22px; font:500 15px "IBM Plex Sans";
  cursor:pointer}
.querybar button:disabled{opacity:.5; cursor:wait}
.samples{padding:0 22px 12px; display:flex; gap:8px; flex-wrap:wrap}
.samples span{font-size:12.5px; color:var(--dim); border:1px solid var(--line);
  border-radius:99px; padding:4px 11px; cursor:pointer}
.samples span:hover{color:var(--text); border-color:var(--built)}
main{display:grid; grid-template-columns:minmax(340px,460px) 1fr;
  gap:14px; padding:0 22px 22px; align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel); border:1px solid var(--line);
  border-radius:10px; padding:14px 16px; margin-bottom:14px}
/* signature element: the interpreted task-spec ticket */
.ticket{background:var(--panel-2); border:1px solid var(--line);
  border-left:4px solid var(--built); border-radius:10px;
  font:13px/1.7 "IBM Plex Mono",monospace; padding:12px 118px 12px 16px; margin-bottom:14px;
  position:relative}
.ticket::after{content:"INTERPRETED"; position:absolute; top:10px; right:12px;
  font:500 10px "IBM Plex Mono"; letter-spacing:.18em; color:var(--built);
  border:1px solid var(--built); border-radius:3px; padding:2px 6px; opacity:.85}
.ticket b{color:var(--built); font-weight:500}
.ticket .note{color:var(--dim); font-size:12px}
h2{font:500 12px "IBM Plex Mono"; letter-spacing:.15em; color:var(--dim);
  text-transform:uppercase; margin-bottom:8px}
#answer{white-space:pre-wrap}
.chips{margin-top:10px; display:flex; gap:6px; flex-wrap:wrap}
.chips span{font:11.5px "IBM Plex Mono"; color:var(--dim);
  border:1px solid var(--line); border-radius:4px; padding:2px 7px}
#map{height:520px; border-radius:10px; border:1px solid var(--line)}
.maprow{display:flex; gap:8px; align-items:center; margin:10px 0 0}
.years{display:flex; gap:6px; flex-wrap:wrap}
.years button{background:var(--panel-2); color:var(--dim);
  border:1px solid var(--line); border-radius:6px; padding:5px 11px;
  font:12.5px "IBM Plex Mono"; cursor:pointer}
.years button.on{color:#161006; background:var(--built); border-color:var(--built)}
.legend{margin-left:auto; display:flex; gap:12px; font-size:12px; color:var(--dim)}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px;
  margin-right:5px; vertical-align:-1px}
#status{color:var(--dim); font-size:13px; min-height:18px; padding:0 22px}
.err{border-left:4px solid var(--water)}
.hide{display:none}
:focus-visible{outline:2px solid var(--built)}
</style>
</head>
<body>
<header>
  <h1>AUIE</h1>
  <div class="sub">Bengaluru urban intelligence · Sentinel-2 · 2019–2025 · 198 BBMP wards</div>
</header>

<div class="querybar">
  <input id="q" placeholder="Ask about a ward, a locality, or the whole city — e.g. How much did Whitefield grow between 2019 and 2025?" autofocus>
  <button id="go">Analyze</button>
</div>
<div class="samples" id="samples"></div>
<div id="status"></div>

<main>
  <section>
    <div class="ticket hide" id="ticket"></div>
    <div class="card hide err" id="msgcard"><h2>Response</h2><div id="msg"></div></div>
    <div class="card hide" id="anscard">
      <h2>Grounded answer</h2>
      <div id="answer"></div>
      <div class="chips" id="cited"></div>
    </div>
    <div class="card hide" id="provcard"><h2>Provenance</h2>
      <div id="prov" style="font:12.5px 'IBM Plex Mono'; color:var(--dim); line-height:1.8"></div>
    </div>
  </section>
  <section>
    <div id="map"></div>
    <div class="maprow">
      <div class="years" id="years"></div>
      <div class="legend">
        <span><i style="background:var(--built)"></i>Built-up</span>
        <span><i style="background:var(--veg)"></i>Vegetation</span>
        <span><i style="background:var(--water)"></i>Water</span>
        <span><i style="background:var(--bare)"></i>Bare</span>
      </div>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SAMPLES = [
  "How much did built-up area grow in Whitefield between 2019 and 2025?",
  "How has Bellandur changed over the years?",
  "Show the city's land cover for 2024.",
  "Did Jayanagar lose vegetation from 2019 to 2025?",
];
const $ = id => document.getElementById(id);
const map = L.map("map", {zoomControl:true}).setView([12.97, 77.59], 11);
L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
  {attribution:"© OpenStreetMap © CARTO", maxZoom:18}).addTo(map);
let outline=null, overlay=null, currentLoc=null;

SAMPLES.forEach(s=>{
  const el=document.createElement("span"); el.textContent=s;
  el.onclick=()=>{$("q").value=s; ask();}; $("samples").appendChild(el);
});
$("go").onclick=ask;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")ask();});

async function ask(){
  const q=$("q").value.trim(); if(!q)return;
  $("go").disabled=true; $("status").textContent="Planning, resolving, clipping…";
  ["ticket","msgcard","anscard","provcard"].forEach(i=>$(i).classList.add("hide"));
  try{
    const r=await fetch("/api/query",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})});
    const d=await r.json();
    if(d.status!=="ok"){
      $("msg").textContent=d.message+(d.candidates?.length?" ("+d.candidates.join(", ")+")":"");
      $("msgcard").classList.remove("hide");
      $("status").textContent="The system declined or asked for clarification — that is a feature.";
      return;
    }
    renderSpec(d.spec); renderAnswer(d); renderProv(d.provenance);
    renderGeometry(d.geometry); renderYears(d.spec.years, d.loc_query);
    $("status").textContent="";
  }catch(e){
    $("msg").textContent="Request failed: "+e; $("msgcard").classList.remove("hide");
    $("status").textContent="";
  }finally{ $("go").disabled=false; }
}

function renderSpec(s){
  const notes=s.notes.length?`\n<span class="note">${s.notes.map(n=>"— "+n).join("<br>— ")}</span>`:"";
  $("ticket").innerHTML=
    `location  <b>${s.location}</b> · ${s.kind} · ${s.wards.length} ward(s)\n`+
    `analysis  <b>${s.analysis}</b>\n`+
    `years     <b>${s.years.join(", ")}</b>`+notes;
  $("ticket").classList.remove("hide");
}
function renderAnswer(d){
  $("answer").textContent=d.answer;
  $("cited").innerHTML=d.cited.map(c=>`<span>${c}</span>`).join("");
  $("anscard").classList.remove("hide");
}
function renderProv(p){
  const v=p.vision||{};
  $("prov").textContent=
    `model: ${v.model} (${v.model_version})\n`+
    `window: ${v.composite_window} · labels: ${v.label_source}\n`+
    `valid pixels: ${JSON.stringify(v.valid_pixel_fraction_by_year)}`;
  $("provcard").classList.remove("hide");
}
function renderGeometry(gj){
  if(outline) map.removeLayer(outline);
  outline=L.geoJSON(gj,{style:{color:"#e0a83c",weight:2,fill:false,dashArray:"4 3"}}).addTo(map);
  map.fitBounds(outline.getBounds(),{padding:[24,24]});
}
function renderYears(years, loc){
  currentLoc=loc; const box=$("years"); box.innerHTML="";
  years.forEach(y=>{
    const b=document.createElement("button"); b.textContent=y;
    b.onclick=()=>loadLayer(y,b); box.appendChild(b);
  });
  if(box.lastChild) loadLayer(years[years.length-1], box.lastChild);
}
async function loadLayer(year, btn){
  document.querySelectorAll(".years button").forEach(b=>b.classList.remove("on"));
  if(btn) btn.classList.add("on");
  $("status").textContent="Rendering "+year+"…";
  const r=await fetch(`/api/layer?year=${year}&loc=${encodeURIComponent(currentLoc)}`);
  const d=await r.json();
  if(d.error){$("status").textContent=d.error; return;}
  if(overlay) map.removeLayer(overlay);
  overlay=L.imageOverlay(d.image, d.bounds, {opacity:.78}).addTo(map);
  $("status").textContent="";
}
</script>
</body>
</html>
